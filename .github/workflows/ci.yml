# Continuous integration.
#
# Two jobs, because they answer different questions:
#
#   gates     — is the tree correct? fmt/lint/types/tests, the two binding rules,
#               the emitted-byte baseline, and the publish manifest.
#   runtimes  — does the CLI actually run where we say it does? The support
#               claim in the README is a promise, and a promise wants a job.
#
# An exit code is not evidence in this codebase. `deno task test` proves the
# suites ran; `bun run baseline` proves the emitted bytes did not move, which
# is a different and stronger claim.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Bun runs the project's scripts (owner, 2026-10-12): `bun run <name>`, from package.json.
      # Installed first, with the dev dependencies (Biome, TypeScript), because the lint and the
      # type check below need them. `--frozen-lockfile`: a bun.lock that disagrees with
      # package.json fails.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      # dprint replaces `deno fmt` (Bun migration B3, cmem/bun-migration.md): the same TypeScript,
      # JSON and Markdown plugins Deno 2.9.7 bundles, pinned by checksum in dprint.json, shown to
      # produce identical bytes. The canary fails a config that checks nothing or the wrong style.
      - name: Format check
        run: bun run fmt:check

      # Biome replaces `deno lint` (Bun migration B3, cmem/bun-migration.md): Biome's recommended
      # rules plus deno lint's require-await / no-var / prefer-const, each disabled rule with its
      # reason in biome.jsonc. Fails on warnings too.
      - name: Lint
        run: bun run lint

      - name: Type-check
        run: deno task check

      # The Bun / Node type check (B2): `tsc` over the shipped code and scripts/, with
      # @types/node pinned to the Node floor and the strict lint flags (noUnusedLocals, …). Runs
      # NEXT TO `deno task check` until tests/ moves over in B5.
      - name: Type-check (tsc, for Bun and Node)
        run: bun run check

      # BINDING (README "upstream names are reserved"). A bare upstream name may
      # appear in a path only where upstream compatibility is the subject.
      #
      # The original one-liner silently stopped working at the merge: its
      # `grep -v '(binaryen|wabt)-ts'` matches the DIRECTORY component, so once
      # src/binaryen-ts/ and src/wabt-ts/ existed it discarded every file in both
      # trees and returned empty on a tree that still held a violation. Prints
      # each offender and exits 1 (its shell predecessor always exited 0).
      - name: Naming rule
        run: bun run naming || { echo "::error::naming rule violated"; exit 1; }

      # BINDING (README "Runtime support"). No Deno globals in shipped source,
      # and no top-level runtime import of a node: builtin anywhere in it (CLI
      # layer included, since open-work 28): node: is portable across
      # Deno/Node/Bun but not to the browser.
      - name: Runtime portability
        run: bun run portability

      # Every export loads in a BROWSER (open-work 28): each export in jsr.json
      # bundled for the browser target, failing on a bundle that does not build
      # or still imports a node: builtin at the top level. The portability rule
      # above reads each file; this follows every import, as a bundler does --
      # the gap through which 15 of 22 exports became unloadable unseen.
      - name: Every export loads in a browser
        run: bun run browser

      - name: Test
        run: deno task test

      # A pure relocation must not move a byte. This is NOT a test: it pins
      # output bytes, so a deliberate encoder improvement is supposed to fail it
      # — re-baseline in the same commit and say why.
      - name: Emitted-byte baseline
        run: bun run baseline

      - name: Verify publish manifest (dry run, no provenance)
        # `--config jsr.json`: the package manifest is jsr.json since 2026-10-12, and with a
        # deno.json present Deno would otherwise take the package from deno.json
        # (cmem/bun-migration.md).
        run: deno publish --dry-run --allow-dirty --config jsr.json

      # REPORTED, NOT GATED, on purpose. This is the convergence indicator: the
      # number of exported type names declared in both `src/` trees. Failing on
      # it would reward making it fall by RENAMING, which moves the number
      # without converging anything -- the one way of moving it that means
      # nothing. `|| true` so a change here can never redden a build.
      - name: Convergence indicator (reported, not gated)
        run: |
          bun run collisions >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          bun run collisions --quiet || true

  runtimes:
    name: CLI on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Deno
            setup: deno
            invoke: deno run -A
          # EVERY current Node LTS line, plus the floor (owner, 2026-10-12: "We should
          # support and test all currently available lts versions"). As of 2026-10:
          # 22 "Jod" (maintenance to 2027-04-30) and 24 "Krypton", and 26, which
          # enters LTS on 2026-10-28. No flag on any of them: the source is erasable
          # TypeScript (open-work 28 part 4; `erasableSyntaxOnly` in tsconfig.json),
          # which Node's default type stripping runs. Node 26 has no other mode.
          - name: Node 22.18 (floor)
            setup: node
            node: '22.18'
            invoke: node
          - name: Node 22 (LTS, latest)
            setup: node
            node: '22'
            invoke: node
          - name: Node 24 (LTS, latest)
            setup: node
            node: '24'
            invoke: node
          - name: Node 26 (LTS from 2026-10-28)
            setup: node
            node: '26'
            invoke: node
          - name: Bun 1.4.0 (floor)
            setup: bun
            bun: '1.4.0'
            invoke: bun
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Deno
        if: matrix.setup == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node
        if: matrix.setup == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Bun
        if: matrix.setup == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # Every dispatcher command, under this runtime. Prints the sha256 of the
      # wat2wasm output so the summary shows all four legs agreeing — the same
      # bytes on every supported runtime is the actual claim. The script itself
      # runs under the runtime it tests (Deno is not installed on the other
      # legs), which is why it uses node: builtins only.
      - name: CLI smoke
        run: |
          h=$(${{ matrix.invoke }} scripts/cli-smoke.ts "${{ matrix.invoke }}")
          echo "wat2wasm output sha256: $h"
          echo "- **${{ matrix.name }}** \`$h\`" >> "$GITHUB_STEP_SUMMARY"
