# JSR publish with OIDC provenance.
#
# Triggered when a git tag matching `v*` is pushed (e.g. `git tag v1.0.0 && git push --tags`),
# or dispatched on a tag ref by `.github/workflows/auto-tag.yml` after it detects a `jsr.json`
# version bump on `main`.
#
# The publish step calls `deno publish` DIRECTLY — not `bun run release`. The task wraps
# `scripts/release/publish.ts`, which spawns `deno publish` as a subprocess via `Deno.Command`.
# That indirection breaks JSR provenance: JSR's OIDC detection runs in the workflow's primary
# process and does not propagate cleanly into the subprocess invocation, so the published
# version gets the "No provenance" flag. The guard script remains in place for local users —
# running `bun run release` from a dev machine still refuses with the correct release-flow
# instructions; CI just doesn't go through it.
#
# The inherited version of this comment cited sibling `wasmtk` as precedent for calling
# `deno publish` directly. Measured 2026-08-26: wasmtk has NO provenance on ANY published
# version, so it is not evidence for anything here. Removed rather than repeated.
#
# ## Provenance fails SILENTLY, and a green run is not proof
#
# `deno publish` skips attestation NON-FATALLY when it cannot mint or submit the OIDC token.
# The run succeeds, the version publishes, and provenance is simply absent. Measured across
# this scope on 2026-08-26:
#
#   wabt-ts      provenance on 1.5.0 (2026-08-26), 1.4.x, and back to 1.2.7 — one gap at 1.3.3
#   binaryen-ts  DARK from 1.3.5 (2026-06-10) through 1.4.3, recovered at 1.5.0 (2026-08-25)
#   wasmtk       last attested release 1.11.2 (2026-07-03); dark ever since, cause unidentified
#
# binaryen-ts's publish.yml is BYTE-IDENTICAL at v1.4.3 (no provenance) and at v1.5.0 (provenance),
# so the workflow is not the variable and editing permissions/YAML is not the fix. Both siblings
# also lost it on the same day, 2026-06-10, which reads as transient rather than configurational.
#
# What follows from that: the ONLY evidence of provenance is JSR's `rekorLogId`. The OIDC
# diagnostic below checks a PREREQUISITE, not the outcome — wasmtk got ten releases of false
# assurance from exactly that step. The verification step at the end is the real gate.
#
# Required permissions:
#   - id-token: write   → OIDC token for JSR provenance
#   - contents: write   → checkout + create GitHub Release after publish
#
# JSR side: link the package (`@jrmarcum/binaryang`) to this GitHub repo in the JSR UI
# under "Settings → GitHub Actions". No JSR token is needed when OIDC is configured.

name: Publish to JSR
# (and to npm, in the `npm` job below, once switched on: open-work 29)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The release tags: the compatibility gate compares this tag with the previous one.
          fetch-depth: 0

      # Deno ONLY for `deno publish` (owner, 2026-10-12: Deno for JSR). Everything else is the CI
      # gate's tooling (Bun migration B6 / B7, 2026-10-13):
      # Bun with the dev dependencies, and Node 24, the V8 referee the suite's verdict comes from.
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Install Node (the V8 referee)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The checks and the read-back poll in this file are scripts/release/workflow.ts, not bash
      # (owner rule, 2026-10-21: a condition or a loop goes in a .ts file; the shell only launches).
      - name: Verify jsr.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun scripts/release/workflow.ts tag-matches "$GITHUB_REF_NAME"

      # The compatibility gate, repeated on the tagged commit (workspace letter H6, rule 2): the
      # version's jump from the PREVIOUS release tag must cover what the surface diff demands.
      - name: Compatibility gate (the version jump covers the surface change)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun scripts/release/api-surface.ts --release-check

      - name: Type-check
        run: bun run check

      # The CI gate's two legs (B5): node:test on Node 24 is the verdict; Bun must fail exactly the
      # known JavaScriptCore differences in tests/bun-known-differences.json.
      - name: Test (node:test on Node 24, the referee)
        run: bun run test

      - name: Test (Bun, against the known JavaScriptCore differences)
        run: bun run test:bun

      # Checks the PREREQUISITE only: are the OIDC env vars present on the runner?
      # This is a diagnostic, NOT evidence — see the header. It is here because when
      # it DOES fail it names the cause immediately (org/enterprise Actions OIDC policy),
      # which is otherwise invisible.
      - name: Check OIDC availability (prerequisite, not proof)
        run: bun scripts/release/workflow.ts oidc-check

      # No `--allow-slow-types`. binaryen-ts needed it for `interop/binaryen-js.ts`'s
      # runtime-configurable `await import(path)`; measured 2026-08-26, the merged tree
      # passes the slow-types check WITHOUT it. Keeping the flag is not neutral — JSR
      # warns that a slow-types package ships NO .d.ts for Node users, and Node support
      # is one of binaryang's published capabilities. `bun run publish:dry` runs the
      # identical command so the gate tests what actually ships.
      # jsr.json is the package manifest; with no deno.json (B7, 2026-10-13) Deno finds it by
      # itself, so `--config jsr.json` came off. Still `deno publish` called DIRECTLY: `bunx jsr publish` downloads Deno and runs this same command as a
      # subprocess, which is the indirection this header warns can lose provenance.
      - name: Publish to JSR (with provenance)
        run: deno publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "binaryang $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      # THE actual evidence. Runs LAST on purpose: JSR versions are immutable, so by the
      # time this runs the version exists either way — failing here surfaces the problem
      # loudly without blocking the publish or the GitHub release. Design taken from
      # wasmtk, which added it after ten releases of silent absence.
      - name: Verify provenance was recorded on JSR
        if: startsWith(github.ref, 'refs/tags/v')
        # JSR ingests attestation asynchronously AND caches this endpoint, so the poll
        # cache-busts each read (the measurement is in workflow.ts).
        run: bun scripts/release/workflow.ts provenance jsr "${GITHUB_REF_NAME#v}"

  # npm, the SECOND registry (open-work 29; owner, 2026-10-20: `@synapticforge1/binaryang`, JSR
  # staying the source). After JSR's job, from the same tag. OFF until the repository variable
  # NPM_PUBLISH is `true` (Settings → Secrets and variables → Actions → Variables), which the owner
  # sets once npm's trusted publisher for this package names this repository and this workflow
  # file. No token: npm trusted publishing takes the workflow's OIDC identity and records
  # provenance (`publishConfig.provenance`). Versions are immutable on npm too: a failed run of
  # this job is RE-RUN alone, never re-tagged. Before switching it on, check npm's current docs
  # for the npm version trusted publishing needs; the step below prints the one in use.
  npm:
    name: Publish ${{ github.ref_name }} to npm
    needs: publish
    if: vars.NPM_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: npm version (trusted publishing needs a recent one)
        run: |
          npm install -g npm@11
          npm --version

      - name: Verify jsr.json version matches tag
        run: bun scripts/release/workflow.ts tag-matches "$GITHUB_REF_NAME"

      # Builds dist/ and proves the tarball (installed and run) before anything is published.
      - name: Build and prove the npm package
        run: bun run npm:prove

      - name: Publish to npm (trusted publishing, provenance)
        working-directory: dist
        run: npm publish

      - name: Verify provenance was recorded on npm
        run: bun scripts/release/workflow.ts provenance npm "${GITHUB_REF_NAME#v}"
