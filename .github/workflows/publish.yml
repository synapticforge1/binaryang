# The release: checks, then CI's tag, then the GitHub Release page, then JSR and npm.
#
# 🔒 The owner's order (2026-11-10, workspace letter H33, `release-process.md` § 5 / § 8 D1): "the
# CI to check first, then push the tag, and then create the release page from the tag, then
# publish the package to the registry for the project in that order." `bun run bump <level>` writes
# the version; `bun run release` commits `bump to vX.Y.Z` and pushes `main` ONLY — no tag is made
# on a machine, ever. This workflow runs on every push to `main`:
#
#   checks     no token  Is this a release? jsr.json's version with no tag on GitHub = NEW; its
#                        tag on THIS commit = a RE-RUN; on another commit = an ordinary push, and
#                        everything stops here (ci.yml checks that). For a release: a NEW number
#                        must be free on JSR and npm (npm never reuses one, C34 (2)); the
#                        compatibility gate, the type check, both test legs, and
#                        `deno publish --dry-run` on exactly the files `jsr` checks out
#   npm-build  no token  builds and PROVES the npm package, packs it, uploads the tarball — BEFORE
#                        the tag (skipped while the NPM_PUBLISH variable is not `true`)
#   tag        contents  once `checks` is green and `npm-build` green or skipped: CI's annotated
#              : write   tag `vX.Y.Z` on this commit (REST API), read back; at this commit already
#                        = done, anywhere else = refused (scripts/release/github.ts)
#   release    contents  the GitHub Release page FROM the tag (workspace letters H30 / H32): the tag
#              : write   peels to this commit, an existing page is done, created, read back
#   jsr        id-token  skips the upload if JSR already has the version (a re-run), writes
#                        `uploaded` BEFORE `deno publish` — which uploads, THEN signs, so a failure
#                        after the upload (1.13.2) must not strand npm — publishes, reads
#                        provenance back
#   npm        id-token  waits for JSR, checks the tarball's manifest (ours, this version, no
#                        scripts, provenance on), skips if npm already serves it, publishes the
#                        PROVEN tarball with --ignore-scripts, reads provenance back
#
# A tag pushed with the job's GITHUB_TOKEN starts NO workflow run, so the page and the publish are
# in THIS run (`needs:`). The run's actor is whoever pushed `main` — the owner, a member of the
# `@jrmarcum` JSR scope — which is what JSR authorises (the dispatched runs auto-tag.yml started had
# the bot as actor and were refused, `actorNotScopeMember`; auto-tag.yml is retired). MEASURED here
# by 3.0.3 (run 43061998593) and 3.0.4 (run 43072390794), all six jobs green.
#
# The npm package is built and PROVEN (`npm-build`) BEFORE CI tags: a package npm would never get
# must not leave a tag, a page and a JSR version behind (review round 1, 2026-11-13). Every job has
# a time limit, and the tools the credentialed jobs install are exact versions (npm, Deno).
#
# Failure (U12): "Re-run failed jobs" — every job skips what is done (a tag at this commit, a
# page, a version a registry serves). Never a new tag for the same code, never a moved tag.
#
# ## Provenance fails SILENTLY, and a green run is not proof
#
# `deno publish` skips attestation NON-FATALLY when it cannot mint or submit the OIDC token: the
# run succeeds, the version publishes, and provenance is simply absent (binaryen-ts was dark from
# 1.3.5 to 1.4.3 with a byte-identical workflow; wasmtk from 1.11.2 on — measured 2026-08-26). The
# ONLY evidence is the registry's own record: JSR's `rekorLogId`, npm's provenance attestation.
# The OIDC step checks a PREREQUISITE, not the outcome; the read-back steps are the real gate.
# `deno publish` is called DIRECTLY: an indirection (`bun run release`, `bunx jsr publish`) runs it
# as a subprocess, which this repo has lost provenance through.
#
# ## The credential sits beside nothing (open-work 54, 2026-11-09; workspace correspondence C30)
#
# `id-token: write` IS the publishing credential: JSR and npm trusted publishing both take this
# workflow's OIDC token, and every step of a job holding it can mint one. So `jsr` and `npm` run
# only pinned actions, `deno publish` / `npm publish`, and the standalone
# `scripts/release/registry.ts`; they check out what they publish and that script, and install
# NOTHING. `tag` and `release` check out their one script and jsr.json. Everything that runs
# dependencies is in `checks` or `npm-build`, without a token. Every action is pinned to a commit
# hash (the comment names its release); move a pin by reading the release tag's commit with
# `git ls-remote`.
#
# JSR side: the package (`@jrmarcum/binaryang`) is linked to this GitHub repo in the JSR UI under
# "Settings → GitHub Actions"; no JSR token. npm side: npm's trusted publisher for
# `@synapticforge1/binaryang` names THIS file — renaming it breaks npm publishing.

name: Release

on:
  push:
    branches:
      - main

# Each commit of `main` is its own group, QUEUED, never cancelled: GitHub drops a PENDING run when
# a newer one joins its group, so one group for `main` could lose a bump commit's run behind
# another push (S3D, 2026-11-10). Two pushes carrying the same untagged version cannot both
# release it: the second `tag` job finds the tag on the other commit and refuses.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  checks:
    name: Checks (is this a release?)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      state: ${{ steps.release.outputs.state }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The release tags: the compatibility gate compares this commit with the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      # Outputs release (true / false), and for a release its state (new / rerun), version, tag.
      # The tag is read from GitHub with `git ls-remote`, never from the local tags.
      - name: Is this a release?
        id: release
        run: bun scripts/release/workflow.ts release-state

      - name: A new number is free on JSR and npm
        if: steps.release.outputs.state == 'new'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bun scripts/release/registry.ts free "$VERSION"

      # The CI gate's tooling (Bun migration B6 / B7, 2026-10-13): Bun with the dev dependencies,
      # and Node 24, the V8 referee the suite's verdict comes from.
      - name: Install dev dependencies
        if: steps.release.outputs.release == 'true'
        run: bun install --frozen-lockfile

      - name: Install Node (the V8 referee)
        if: steps.release.outputs.release == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # The compatibility gate, on the commit CI is about to tag (workspace letter H6, rule 2): the
      # version's jump from the PREVIOUS release tag must cover what the surface diff demands.
      - name: Compatibility gate (the version jump covers the surface change)
        if: steps.release.outputs.release == 'true'
        run: bun scripts/release/api-surface.ts --release-check

      - name: Type-check
        if: steps.release.outputs.release == 'true'
        run: bun run check

      # The CI gate's two legs (B5): node:test on Node 24 is the verdict; Bun must fail exactly the
      # known JavaScriptCore differences in tests/bun-known-differences.json.
      - name: Test (node:test on Node 24, the referee)
        if: steps.release.outputs.release == 'true'
        run: bun run test

      - name: Test (Bun, against the known JavaScriptCore differences)
        if: steps.release.outputs.release == 'true'
        run: bun run test:bun

      # Deno ONLY for `deno publish` (owner, 2026-10-12: Deno for JSR).
      - name: Install Deno
        if: steps.release.outputs.release == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      # The `jsr` job publishes from a checkout of jsr.json's `publish.include` alone — no
      # package.json, no lockfile, no node_modules. Rehearse exactly that tree here (measured
      # 2026-11-09: the same 136 files, and the slow-types check passes, as from the full tree).
      - name: Checkout the published files only (as the jsr job does)
        if: steps.release.outputs.release == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: jsr-tree
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /jsr.json
            /main.ts
            /src/
            /README.md
            /LICENSE
            /LICENSE-MIT
            /LICENSE-APACHE
            /NOTICE.md

      # No `--allow-slow-types` (measured 2026-08-26: the tree passes the slow-types check without
      # it, and a slow-types package ships NO .d.ts for Node users).
      - name: JSR dry run, on the tree the jsr job publishes
        if: steps.release.outputs.release == 'true'
        working-directory: jsr-tree
        run: deno publish --dry-run

  # CI pushes the tag, only after `checks` is green on THIS commit (D1, U6) AND the npm package is
  # built and proven (review round 1, 2026-11-13: a package that cannot build for npm used to get
  # its tag, its page and its JSR version first). A SKIPPED `npm-build` means npm publishing was
  # off when `npm-build` was decided; `tag` reads that RESULT, never the variable again (review
  # round 2, 2026-11-13: the variable switched on between the two, or before a re-run, skipped
  # `tag` — and everything after it — in a run that ended green, releasing nothing).
  tag:
    name: Tag ${{ needs.checks.outputs.tag }}
    needs: [checks, npm-build]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.release == 'true' && (needs.npm-build.result == 'success' || needs.npm-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout the GitHub script and the manifest only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /jsr.json
            /scripts/release/github.ts

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Create the annotated tag on this commit (REST API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: bun scripts/release/github.ts tag "$TAG"

  # The GitHub Release page, FROM the tag, BEFORE the publish (the owner's order, D1, U7; H32's
  # recipe; no GitHub CLI, H30). github.ts refuses unless the tag is on GitHub and peels to this
  # run's commit (POST /releases would CREATE a missing tag), treats an existing page as done, and
  # reads the page back. A failed publish leaves a page for a version its re-run then publishes.
  release:
    name: GitHub Release ${{ needs.checks.outputs.tag }}
    needs: [checks, tag]
    # Explicit: a default condition skips this job when ANY job upstream was skipped — and
    # `npm-build` is skipped whenever npm publishing is off.
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout the GitHub script and the manifest only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /jsr.json
            /scripts/release/github.ts

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Create the GitHub Release page from the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: bun scripts/release/github.ts release "$TAG"

  jsr:
    name: Publish ${{ needs.checks.outputs.tag }} to JSR
    needs: [checks, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    # Written BEFORE `deno publish`: npm runs on this, not on `deno publish`'s exit, and first waits
    # for JSR to serve the version (C34 (1); 1.13.2 failed after its upload and stranded npm).
    outputs:
      uploaded: ${{ steps.attempt.outputs.uploaded }}

    steps:
      # What jsr.json publishes, and the one script this job runs. Nothing else, nothing installed.
      - name: Checkout the published files and the registry script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /jsr.json
            /main.ts
            /src/
            /README.md
            /LICENSE
            /LICENSE-MIT
            /LICENSE-APACHE
            /NOTICE.md
            /scripts/release/registry.ts

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      # A re-run after a failure past the upload finds the version there and skips the upload.
      - name: Does JSR already have this version?
        id: jsr
        run: bun scripts/release/registry.ts jsr-has "$VERSION"

      # Checks the PREREQUISITE only: are the OIDC env vars present on the runner? A diagnostic,
      # NOT evidence — see the header. When it DOES fail it names the cause immediately
      # (org/enterprise Actions OIDC policy), which is otherwise invisible.
      - name: Check OIDC availability (prerequisite, not proof)
        run: bun scripts/release/registry.ts oidc-check

      - name: Record the upload attempt (before the upload)
        id: attempt
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # jsr.json is the package manifest; Deno finds it by itself. scripts/** is outside jsr.json's
      # include, so the registry script is not published.
      - name: Publish to JSR (with provenance)
        if: steps.jsr.outputs.present == 'false'
        run: deno publish

      # THE actual evidence, FATAL. JSR ingests attestation asynchronously AND caches this
      # endpoint, so the poll cache-busts each read (the measurement is in registry.ts).
      - name: Verify provenance was recorded on JSR
        run: bun scripts/release/registry.ts provenance jsr "$VERSION"

  # npm, the SECOND registry (open-work 29; owner, 2026-10-20: `@synapticforge1/binaryang`, JSR
  # staying the source). ON while the repository variable NPM_PUBLISH is `true` (Settings →
  # Secrets and variables → Actions → Variables). No token: npm trusted publishing takes the
  # workflow's OIDC identity and records provenance (`publishConfig.provenance`).
  #
  # Built and proven WITHOUT the credential; only the proven tarball crosses to the job that has it.
  npm-build:
    name: Build ${{ needs.checks.outputs.tag }} for npm
    needs: checks
    if: vars.NPM_PUBLISH == 'true' && needs.checks.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Builds dist/ and proves the tarball (installed and run) before anything is published.
      - name: Build and prove the npm package
        run: bun run npm:prove

      # `--pack-destination` must exist: npm does not create it (ENOENT, exit 38 — what failed
      # 3.0.0's npm-build, 2026-11-09).
      - name: Pack the proven package
        working-directory: dist
        run: |
          mkdir -p ../npm-pack
          npm pack --pack-destination ../npm-pack

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: npm-pack/*.tgz
          if-no-files-found: error
          # A re-run of this job uploads again under the same name.
          overwrite: true
          retention-days: 7

  npm:
    name: Publish ${{ needs.checks.outputs.tag }} to npm
    needs: [checks, jsr, npm-build]
    if: ${{ !cancelled() && needs.jsr.outputs.uploaded == 'true' && needs.npm-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}

    steps:
      - name: Checkout the registry script and the manifest only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /jsr.json
            /scripts/release/registry.ts

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm 11, as every release since 1.13.3 (trusted publishing needs a recent one); its own
      # package, with no install scripts run. An EXACT version (review round 1, 2026-11-13): the
      # floating `npm@11` resolved to whatever was newest, inside the job holding the credential.
      # 11.21.2 is what `npm@11` was in the 3.0.3 and 3.0.4 runs (newest 11.x since 2026-11-04).
      - name: npm version (trusted publishing needs a recent one)
        run: |
          npm install -g npm@11.21.2 --ignore-scripts
          npm --version

      - name: Download the proven tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-pack

      # npm after JSR, the source: only once JSR serves the version.
      - name: Wait until JSR serves the version
        run: bun scripts/release/registry.ts jsr-wait "$VERSION"

      - name: Check the tarball (ours, this version, no scripts, provenance on)
        id: tgz
        run: bun scripts/release/registry.ts npm-tarball npm-pack "$VERSION"

      # `published` = a re-run after npm already took it: nothing to upload.
      - name: Does npm already serve this version?
        id: state
        run: bun scripts/release/registry.ts npm-state "$VERSION"

      - name: Publish to npm (trusted publishing, provenance)
        if: steps.state.outputs.state == 'free'
        env:
          TARBALL: ${{ steps.tgz.outputs.tarball }}
        run: npm publish "$TARBALL" --ignore-scripts

      - name: Verify provenance was recorded on npm
        run: bun scripts/release/registry.ts provenance npm "$VERSION"
